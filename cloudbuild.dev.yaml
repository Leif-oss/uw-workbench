# Google Cloud Build configuration for DEV environment
# This is a separate build config for dev deployments
# Usage: gcloud builds submit --config cloudbuild.dev.yaml

steps:
  # Build and push backend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/uw-workbench-backend-dev:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/uw-workbench-backend-dev:latest'
      - './backend'
    id: 'build-backend'
  
  # Push backend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/uw-workbench-backend-dev'
    id: 'push-backend'
    waitFor: ['build-backend']
  
  # Deploy backend to Cloud Run (DEV)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'uw-workbench-backend-dev'
      - '--image'
      - 'gcr.io/$PROJECT_ID/uw-workbench-backend-dev:$BUILD_ID'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--timeout=300'
      - '--max-instances=10'
      - '--set-secrets=AI_API_KEY=ai-api-key-dev:latest,DB_PASSWORD=db-password-dev:latest,SMTP_HOST=smtp-host-dev:latest,SMTP_PORT=smtp-port-dev:latest,SMTP_USER=smtp-user-dev:latest,SMTP_PASSWORD=smtp-password-dev:latest,SMTP_FROM_EMAIL=smtp-from-email-dev:latest,SMTP_FROM_NAME=smtp-from-name-dev:latest'
      - '--set-env-vars=ENVIRONMENT=development,TEMP_SETUP_MODE=true,DB_USER=postgres,DB_NAME=uw_workbench,CLOUD_SQL_CONNECTION_NAME=ultra-ace-481723-e6:us-central1:uw-workbench-db-dev'
      - '--add-cloudsql-instances'
      - 'ultra-ace-481723-e6:us-central1:uw-workbench-db-dev'
    id: 'deploy-backend'
    waitFor: ['push-backend']
  
  # Get backend URL for frontend build
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        BACKEND_URL=$$(gcloud run services describe uw-workbench-backend-dev --region=us-central1 --format="value(status.url)")
        echo "Backend URL: $$BACKEND_URL"
        echo "$$BACKEND_URL" > /workspace/backend-url.txt
    id: 'get-backend-url'
    waitFor: ['deploy-backend']
  
  # Build and push frontend image with backend URL
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args:
      - '-c'
      - |
        BACKEND_URL=$$(cat /workspace/backend-url.txt)
        echo "Building frontend with backend URL: $$BACKEND_URL"
        docker build \
          --build-arg VITE_API_URL=$$BACKEND_URL \
          -t gcr.io/$PROJECT_ID/uw-workbench-frontend-dev:$BUILD_ID \
          -t gcr.io/$PROJECT_ID/uw-workbench-frontend-dev:latest \
          ./frontend
    id: 'build-frontend'
    waitFor: ['get-backend-url']
  
  # Push frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/uw-workbench-frontend-dev'
    id: 'push-frontend'
    waitFor: ['build-frontend']
  
  # Deploy frontend to Cloud Run (DEV)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'uw-workbench-frontend-dev'
      - '--image'
      - 'gcr.io/$PROJECT_ID/uw-workbench-frontend-dev:$BUILD_ID'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory=256Mi'
      - '--set-env-vars=ENVIRONMENT=development'
    id: 'deploy-frontend'
    waitFor: ['push-frontend']
  
  # Update backend CORS with frontend URL
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        FRONTEND_URL=$$(gcloud run services describe uw-workbench-frontend-dev --region=us-central1 --format="value(status.url)")
        echo "Frontend URL: $$FRONTEND_URL"
        echo "Updating backend CORS with frontend URL..."
        gcloud run services update uw-workbench-backend-dev \
          --region=us-central1 \
          --update-env-vars="CORS_ORIGINS=$$FRONTEND_URL,FRONTEND_URL=$$FRONTEND_URL"
    id: 'update-cors'
    waitFor: ['deploy-frontend']

images:
  - 'gcr.io/$PROJECT_ID/uw-workbench-backend-dev:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/uw-workbench-backend-dev:latest'
  - 'gcr.io/$PROJECT_ID/uw-workbench-frontend-dev:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/uw-workbench-frontend-dev:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
