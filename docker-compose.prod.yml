version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: uw-workbench-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uw_workbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-uw_workbench}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uw_workbench}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - uw-workbench-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Optimize for fast rebuilds - cache layers
      cache_from:
        - python:3.12-slim
    container_name: uw-workbench-backend
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-uw_workbench}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-uw_workbench}
      
      # CORS - Set to your domain(s)
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      
      # Frontend URL for email links
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      
      # Environment
      ENVIRONMENT: production
      
      # AI API Key (optional, for AI features)
      AI_API_KEY: ${AI_API_KEY:-}
      
      # SMTP Configuration (optional, for email features)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-UW Workbench}
      
      # Port (internal, not exposed)
      PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - uw-workbench-network

  # React Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.vps
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost/api}
      # Optimize for fast rebuilds - cache layers
      cache_from:
        - node:20-alpine
        - nginx:alpine
    container_name: uw-workbench-frontend
    environment:
      # Port (internal, not exposed)
      PORT: 3000
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - uw-workbench-network

  # Caddy Reverse Proxy
  caddy:
    image: caddy:2.8-alpine
    container_name: uw-workbench-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - uw-workbench-network

volumes:
  postgres_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  uw-workbench-network:
    driver: bridge
