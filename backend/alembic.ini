[alembic]
script_location = alembic
# Note: sqlalchemy.url is overridden by DATABASE_URL from backend/database.py
# This is kept for reference only - actual connection uses DATABASE_URL env var
sqlalchemy.url = postgresql+psycopg2://uw_workbench:dev_password_change_me@localhost:5432/uw_workbench

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
